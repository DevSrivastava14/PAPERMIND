services:
  papermind:
    build: .
    container_name: papermind
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PAPER_MIND_DOC_ROOT=/app/data
      - HF_HOME=/home/app/.cache/huggingface
    volumes:
      - ./data:/app/data:ro
      - hf_cache:/home/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  hf_cache:

